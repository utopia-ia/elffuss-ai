<div class="intro">
    <h1>{{t:title}}</h1>
    <p>{{t:intro}}</p>
  </div>
  <section class="group" aria-labelledby="create-title">
    <h2 id="create-title">{{t:section.create}}</h2>
    <p class="muted">{{t:section.createLine}}</p>
    <ul class="cards tools" data-group="create">
{{html:createCards}}
    </ul>
  </section>
  <section class="group" aria-labelledby="photo-title">
    <h2 id="photo-title">{{t:section.photo}}</h2>
    <p class="muted">{{t:section.photoLine}}</p>
    <ul class="cards tools" data-group="photo">
{{html:photoCards}}
    </ul>
  </section>
  <section class="group apps" aria-labelledby="apps-title">
    <h2 id="apps-title">{{t:section.apps}}</h2>
    <p class="muted">{{t:apps.source}}</p>
    <ul class="cards">
{{html:appCards}}
    </ul>
  </section>
