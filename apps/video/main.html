  <h1>{{t:title}}</h1>
  <p>{{t:intro}}</p>
  <fieldset class="modes" data-role="modes" hidden>
    <legend class="visually-hidden">{{t:mode.legend}}</legend>
    <label><input type="radio" name="mode" value="image" data-input="mode" checked> {{t:mode.image}}</label>
    <label><input type="radio" name="mode" value="text" data-input="mode"> {{t:mode.text}}</label>
    <label data-role="mode-story" hidden><input type="radio" name="mode" value="story" data-input="mode"> {{t:mode.story}}</label>
  </fieldset>
  <fieldset class="settings" data-role="story-settings" hidden>
    <legend>{{t:story.title}}</legend>
    <label class="wide">{{t:story.prompt}}
      <textarea rows="3" maxlength="2000" data-input="story-prompt" placeholder="{{t:story.placeholder}}"></textarea>
    </label>
    <label>{{t:story.seconds}} <select data-input="story-seconds">
      <option value="3">3 s</option><option value="6">6 s</option><option value="9" selected>9 s</option>
    </select></label>
    <label>{{t:story.size}} <select data-input="story-size">
      <option value="832x480">{{t:aspect.wide}}</option><option value="480x832">{{t:aspect.tall}}</option><option value="624x624">{{t:aspect.square}}</option>
    </select></label>
    <label>{{t:story.start}} <input type="file" accept="image/*" data-input="story-start"></label>
    <label>{{t:story.end}} <input type="file" accept="image/*" data-input="story-end"></label>
    <label>{{t:text.seed}} <input type="number" min="0" max="4294967295" step="1" inputmode="numeric" data-input="story-seed"></label>
    <p class="muted" data-role="story-photos"></p>
    <p class="muted" data-role="story-gate"></p>
  </fieldset>
  <section data-role="story" hidden></section>
  <fieldset class="settings" data-role="text-settings" hidden>
    <legend>{{t:text.title}}</legend>
    <label class="wide">{{t:text.prompt}}
      <textarea rows="3" maxlength="2000" data-input="prompt" placeholder="{{t:text.placeholder}}"></textarea>
    </label>
    <label>{{t:text.size}} <select data-input="size"></select></label>
    <label>{{t:text.seconds}} <select data-input="gen-seconds"></select></label>
    <label>{{t:text.steps}} <select data-input="steps"></select></label>
    <label>{{t:text.seed}} <input type="number" min="0" max="4294967295" step="1" inputmode="numeric" data-input="seed"></label>
    <p class="muted" data-role="text-gate"></p>
  </fieldset>
  <label class="drop">
    <span>{{t:drop}}</span>
    <input class="visually-hidden" type="file" accept="{{v:accept}}" data-input="files">
  </label>
  <p class="actions" data-role="make-image" hidden><button class="ghost" type="button" data-action="make-image">{{t:hook.image}}</button></p>
  <figure class="stage" data-role="preview" hidden>
    <img data-role="still" alt="{{t:preview.alt}}">
    <canvas data-role="live" role="img" aria-label="{{t:live.label}}" hidden></canvas>
    <figcaption data-role="preview-caption"></figcaption>
  </figure>
  <p class="actions" data-role="playback" hidden>
    <button class="ghost" type="button" data-action="play" aria-pressed="true">{{t:live.pause}}</button>
    <label class="grow">{{t:live.time}} <input type="range" min="0" max="1000" step="1" value="0" data-input="time"></label>
  </p>
  <fieldset class="settings" data-role="settings" data-mode="image">
    <legend>{{t:settings.title}}</legend>
    <label>{{t:settings.preset}}
      <select data-input="preset">
        <option value="dolly-in">{{t:preset.dolly-in}}</option>
        <option value="orbit">{{t:preset.orbit}}</option>
        <option value="swing">{{t:preset.swing}}</option>
        <option value="zoom-pan">{{t:preset.zoom-pan}}</option>
        <option value="vertigo">{{t:preset.vertigo}}</option>
      </select>
    </label>
    <label>{{t:settings.aspect}}
      <select data-input="aspect">
        <option value="16:9">{{t:aspect.wide}}</option>
        <option value="9:16">{{t:aspect.tall}}</option>
        <option value="1:1">{{t:aspect.square}}</option>
      </select>
    </label>
    <label>{{t:settings.seconds}} <output data-role="seconds-value">6 s</output>
      <input type="range" min="2" max="15" step="1" value="6" data-input="seconds">
    </label>
    <label>{{t:settings.strength}}
      <input type="range" min="40" max="160" step="5" value="100" data-input="strength">
    </label>
    <label class="check"><input type="checkbox" data-input="dof"> {{t:settings.dof}}</label>
    <label>{{t:settings.sound}}
      <select data-input="sound">
        <option value="none">{{t:sound.none}}</option>
        <option value="file">{{t:sound.file}}</option>
        <option value="music" hidden>{{t:sound.music}}</option>
      </select>
    </label>
    <label data-role="sound-file" hidden>{{t:sound.pick}} <input type="file" accept="audio/*" data-input="sound-file"></label>
    <p class="muted" data-role="sound-name"></p>
  </fieldset>
  <p data-role="model">{{html:modelLine}}</p>
  <p data-role="model-text" hidden>{{html:modelLine2}}</p>
  <p data-role="model-story" hidden>{{html:modelLine3}}</p>
  <p class="actions">
    <button class="primary" type="button" data-action="start" data-label-run="{{t:action.run}}" data-label-download="{{t:action.downloadAndRun}}" disabled>{{t:action.run}}</button>
    <button class="ghost" type="button" data-action="cancel" hidden>{{t:action.cancel}}</button>
  </p>
  <progress hidden></progress>
  <p class="status" role="status" aria-live="polite"></p>
  <section class="result" hidden>
    <h2>{{t:result.title}}</h2>
  </section>
{{html:storage}}
