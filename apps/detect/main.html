<div class="intro">
    <h1>{{t:title}}</h1>
    <p>{{t:intro}}</p>
  </div>
  <div class="studio">
    <div class="desk">
      <label class="drop">
        {{html:upload}}
        <span>{{t:drop}}</span>
        <input class="visually-hidden" type="file" id="file" accept="{{v:accept}}" data-input="files">
      </label>
      <div class="camera">
        <p class="actions">
          <button class="ghost" type="button" data-action="camera">{{t:camera.start}}</button>
          <button class="ghost" type="button" data-action="stop" hidden>{{t:camera.stop}}</button>
        </p>
        <p class="hint">{{t:camera.note}}</p>
      </div>
      <fieldset class="options">
        <legend>{{t:ui.settings}}</legend>
        <div class="field">
          <div class="field-head">
            <label for="threshold">{{t:threshold.label}}</label>
            <output for="threshold" data-role="threshold-value">{{t:threshold.default}}</output>
          </div>
          <input id="threshold" type="range" min="0.3" max="0.9" step="0.05" value="0.5" data-input="threshold">
          <p class="ends" id="threshold-ends"><span>{{t:threshold.low}}</span><span>{{t:threshold.high}}</span></p>
        </div>
      </fieldset>
      <div class="go">
        <p class="actions">
          <button class="primary" type="button" data-action="start" data-label-run="{{t:action.run}}" data-label-download="{{t:action.downloadAndRun}}" disabled>{{t:action.run}}</button>
        </p>
        <progress hidden></progress>
        <p class="status" role="status" aria-live="polite"></p>
        <p data-role="model">{{html:modelLine}}</p>
      </div>
    </div>
    <div class="canvas">
      <label class="placeholder" for="file" data-drop aria-hidden="true">
        {{html:icon}}
        <strong>{{t:canvas.idle}}</strong>
        <span>{{t:ui.dropHint}}</span>
      </label>
      <section class="result" hidden>
        <h2>{{t:result.title}}</h2>
        <article class="card">
          <p data-role="summary"></p>
          <p class="muted" data-role="note" hidden></p>
          <p class="actions">
            <button class="ghost" type="button" data-action="download-png">{{t:action.downloadPng}}</button>
            <button class="ghost" type="button" data-action="download-json">{{t:action.downloadJson}}</button>
          </p>
          <figure class="stage">
            <img alt="{{t:stage.alt}}" data-role="image" hidden>
            <video muted playsinline data-role="video" hidden></video>
            <canvas data-role="frame" hidden></canvas>
            <canvas class="overlay" data-role="overlay" aria-hidden="true"></canvas>
          </figure>
          <ol class="objects" data-role="objects"></ol>
        </article>
      </section>
    </div>
  </div>
{{html:storage}}
