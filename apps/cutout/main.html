<div class="intro">
    <h1>{{t:title}}</h1>
    <p>{{t:intro}}</p>
  </div>
  <div class="studio">
    <div class="desk">
      <label class="drop">
        {{html:upload}}
        <span>{{t:drop}}</span>
        <input class="visually-hidden" type="file" id="file" accept="{{v:accept}}" data-input="files">
      </label>
      <div class="go">
        <p class="actions">
          <button class="primary" type="button" data-action="start" data-label-run="{{t:action.run}}" data-label-download="{{t:action.downloadAndRun}}" disabled>{{t:action.run}}</button>
          <button class="ghost" type="button" data-action="cancel" hidden>{{t:action.cancel}}</button>
        </p>
        <progress hidden></progress>
        <p class="status" role="status" aria-live="polite"></p>
        <p data-role="model">{{html:modelLine}}</p>
      </div>
    </div>
    <div class="canvas">
      <label class="placeholder" for="file" data-drop aria-hidden="true">
        {{html:icon}}
        <strong>{{t:canvas.idle}}</strong>
        <span>{{t:ui.dropHint}}</span>
      </label>
      <figure class="stage" data-role="preview" hidden>
        <img data-role="preview-image" alt="{{t:preview.alt}}">
        <figcaption data-role="chosen"></figcaption>
      </figure>
      <section class="result" hidden>
        <h2>{{t:result.title}}</h2>
      </section>
    </div>
  </div>
{{html:storage}}
